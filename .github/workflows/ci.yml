name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-services:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/auth-service
          - services/catalog-service
          - services/notifications-service
          - gateway
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
      - name: Gerar o Prisma Client
        if: matrix.service == 'services/auth-service'
        run: npx prisma generate
      - run: npm test

  java-services:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/orders-service
          - services/payments-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode test

  storefront:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production

  e2e:
    name: smoke test (docker compose)
    runs-on: ubuntu-latest
    needs: [node-services, java-services, storefront, admin]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Preparar variáveis de ambiente
        run: cp infra/.env.example infra/.env
      - name: Subir a stack completa
        working-directory: infra
        run: docker compose --profile apps up -d --build --wait --wait-timeout 600
      - name: Smoke test da Saga
        shell: pwsh
        run: ./scripts/smoke-test.ps1
      - name: Logs dos containers em caso de falha
        if: failure()
        working-directory: infra
        run: docker compose --profile apps logs --no-color --tail 200
      - name: Derrubar a stack
        if: always()
        working-directory: infra
        run: docker compose --profile apps down -v
