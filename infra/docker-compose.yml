services:
  postgres:
    image: postgres:16-alpine
    container_name: shopmesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopmesh
      POSTGRES_PASSWORD: shopmesh
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopmesh -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: shopmesh-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: shopmesh
      MONGO_INITDB_ROOT_PASSWORD: shopmesh
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
