apiVersion: v1
kind: Service
metadata:
  name: admin
  labels:
    app.kubernetes.io/name: admin
spec:
  selector:
    app.kubernetes.io/name: admin
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  labels:
    app.kubernetes.io/name: admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: admin
          image: shopmesh/admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            # URL pública do gateway, vista pelo navegador (via Ingress).
            - name: SHOPMESH_API_URL
              value: http://api.shopmesh.local
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
