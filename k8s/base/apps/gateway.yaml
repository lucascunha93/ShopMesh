apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: gateway
          image: shopmesh/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: shopmesh-config
          env:
            - name: PORT
              value: "3000"
            - name: OTEL_SERVICE_NAME
              value: api-gateway
            - name: AUTH_SERVICE_URL
              value: http://auth-service:3001
            - name: CATALOG_SERVICE_URL
              value: http://catalog-service:3002
            - name: ORDERS_SERVICE_URL
              value: http://orders-service:8081
            - name: PAYMENTS_SERVICE_URL
              value: http://payments-service:8083
            - name: NOTIFICATIONS_SERVICE_URL
              value: http://notifications-service:3003
            - name: CORS_ORIGINS
              value: http://shopmesh.local,http://admin.shopmesh.local
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 192Mi }
