apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: auth-service
spec:
  selector:
    app.kubernetes.io/name: auth-service
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: /metrics
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      # Aplica as migrações do Prisma antes de iniciar o serviço.
      initContainers:
        - name: migrate
          image: shopmesh/auth-service:latest
          imagePullPolicy: IfNotPresent
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: shopmesh-secrets, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: postgresql://shopmesh:$(POSTGRES_PASSWORD)@postgres:5432/auth_db?schema=public
      containers:
        - name: auth-service
          image: shopmesh/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: shopmesh-config
          env:
            - name: PORT
              value: "3001"
            - name: OTEL_SERVICE_NAME
              value: auth-service
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: shopmesh-secrets, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: postgresql://shopmesh:$(POSTGRES_PASSWORD)@postgres:5432/auth_db?schema=public
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: shopmesh-secrets, key: JWT_SECRET }
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef: { name: shopmesh-secrets, key: ADMIN_EMAIL }
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: shopmesh-secrets, key: ADMIN_PASSWORD }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
