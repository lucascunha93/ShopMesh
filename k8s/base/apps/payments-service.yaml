apiVersion: v1
kind: Service
metadata:
  name: payments-service
  labels:
    app.kubernetes.io/name: payments-service
spec:
  selector:
    app.kubernetes.io/name: payments-service
  ports:
    - name: http
      port: 8083
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-service
  labels:
    app.kubernetes.io/name: payments-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: /actuator/prometheus
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: payments-service
          image: shopmesh/payments-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: shopmesh-config
          env:
            - name: PORT
              value: "8083"
            - name: DATABASE_URL
              value: jdbc:postgresql://postgres:5432/payments_db
            - name: DATABASE_USER
              value: shopmesh
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: { name: shopmesh-secrets, key: POSTGRES_PASSWORD }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: shopmesh-secrets, key: JWT_SECRET }
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
          # A JVM demora a subir: o startupProbe evita reinícios precoces.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 768Mi }
