apiVersion: v1
kind: Service
metadata:
  name: notifications-service
  labels:
    app.kubernetes.io/name: notifications-service
spec:
  selector:
    app.kubernetes.io/name: notifications-service
  ports:
    - name: http
      port: 3003
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  labels:
    app.kubernetes.io/name: notifications-service
spec:
  # O feed fica no MongoDB, então o serviço pode escalar horizontalmente.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notifications-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifications-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3003"
        prometheus.io/path: /metrics
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: notifications-service
          image: shopmesh/notifications-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3003
          envFrom:
            - configMapRef:
                name: shopmesh-config
          env:
            - name: PORT
              value: "3003"
            - name: OTEL_SERVICE_NAME
              value: notifications-service
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef: { name: shopmesh-secrets, key: MONGO_PASSWORD }
            - name: MONGO_URI
              value: mongodb://shopmesh:$(MONGO_PASSWORD)@mongo:27017/shopmesh_notifications?authSource=admin
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: shopmesh-secrets, key: JWT_SECRET }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 192Mi }
