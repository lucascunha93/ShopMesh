kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shopmesh
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Expõe o Ingress NGINX no host: http://shopmesh.local (com o arquivo hosts apontando para 127.0.0.1).
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
